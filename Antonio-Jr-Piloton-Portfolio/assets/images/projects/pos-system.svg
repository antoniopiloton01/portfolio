<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A121D"/>
      <stop offset="100%" stop-color="#16273D"/>
    </linearGradient>
    <linearGradient id="champGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EADF"/>
      <stop offset="100%" stop-color="#D8B68A"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bgPos)"/>
  <!-- Ambient grid line pattern -->
  <line x1="0" y1="90" x2="600" y2="90" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="180" x2="600" y2="180" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="270" x2="600" y2="270" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="150" y1="0" x2="150" y2="360" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="360" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="450" y1="0" x2="450" y2="360" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- POS Modern Cashier / Touch Register Terminal -->
  <g transform="translate(50, 45)">
    <!-- Terminal Chassis -->
    <rect x="0" y="0" width="500" height="270" rx="12" fill="#101D2D" stroke="rgba(216, 182, 138, 0.4)" stroke-width="1.5"/>
    <rect x="0" y="0" width="500" height="34" rx="12" fill="#182A40"/>
    <rect x="0" y="22" width="500" height="12" fill="#182A40"/>

    <text x="24" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10.5" fill="#D8B68A">RetailPOS • Commercial Multi-Branch Terminal</text>
    <rect x="375" y="7" width="105" height="20" rx="10" fill="#102B1D"/>
    <circle cx="388" cy="17" r="3.5" fill="#10B981"/>
    <text x="432" y="21" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#6EE7B7" text-anchor="middle">ONLINE • SYNCED</text>

    <!-- Product Grid Left -->
    <g transform="translate(20, 50)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="85" height="60" rx="6" fill="#152436" stroke="#243C58" stroke-width="1"/>
      <text x="8" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#F6F5F1">Commercial SKU 1</text>
      <text x="8" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" fill="#8FA2B6">Stock: 148</text>
      <text x="8" y="50" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#D8B68A">₱350.00</text>

      <!-- Item 2 -->
      <rect x="95" y="0" width="85" height="60" rx="6" fill="#152436" stroke="#243C58" stroke-width="1"/>
      <text x="103" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#F6F5F1">Commercial SKU 2</text>
      <text x="103" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" fill="#8FA2B6">Stock: 212</text>
      <text x="103" y="50" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#D8B68A">₱420.00</text>

      <!-- Item 3 -->
      <rect x="190" y="0" width="85" height="60" rx="6" fill="#152436" stroke="#243C58" stroke-width="1"/>
      <text x="198" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#F6F5F1">Pack Item</text>
      <text x="198" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" fill="#8FA2B6">Stock: 350</text>
      <text x="198" y="50" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#D8B68A">₱85.00</text>

      <!-- Item 4 -->
      <rect x="0" y="70" width="85" height="60" rx="6" fill="#152436" stroke="#243C58" stroke-width="1"/>
      <text x="8" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#F6F5F1">Hardware Module</text>
      <text x="8" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" fill="#8FA2B6">Stock: 74</text>
      <text x="8" y="120" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#D8B68A">₱750.00</text>

      <!-- Item 5 -->
      <rect x="95" y="70" width="85" height="60" rx="6" fill="#152436" stroke="#243C58" stroke-width="1"/>
      <text x="103" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#F6F5F1">Barcode Roll</text>
      <text x="103" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" fill="#8FA2B6">Stock: 190</text>
      <text x="103" y="120" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#D8B68A">₱180.00</text>

      <!-- Item 6 -->
      <rect x="190" y="70" width="85" height="60" rx="6" fill="#152436" stroke="#243C58" stroke-width="1"/>
      <text x="198" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#F6F5F1">Thermal Paper</text>
      <text x="198" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" fill="#8FA2B6">Stock: 65</text>
      <text x="198" y="120" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#D8B68A">₱290.00</text>
    </g>

    <!-- Receipt / Cart Panel Right -->
    <g transform="translate(315, 50)">
      <rect x="0" y="0" width="165" height="200" rx="8" fill="#132233" stroke="#243C58" stroke-width="1"/>
      <text x="12" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#F6F5F1">Active Order #1042</text>
      
      <!-- Cart rows -->
      <text x="12" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#CBD5E1">1x Commercial SKU 1</text>
      <text x="150" y="45" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#D8B68A" text-anchor="end">₱350.00</text>

      <text x="12" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#CBD5E1">2x Thermal Paper</text>
      <text x="150" y="65" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#D8B68A" text-anchor="end">₱580.00</text>

      <line x1="12" y1="90" x2="150" y2="90" stroke="#243C58" stroke-width="1"/>

      <text x="12" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#8FA2B6">Subtotal</text>
      <text x="150" y="110" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#F6F5F1" text-anchor="end">₱930.00</text>

      <text x="12" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#F6F5F1">TOTAL</text>
      <text x="150" y="130" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#D8B68A" text-anchor="end">₱930.00</text>

      <!-- Pay Button -->
      <rect x="12" y="150" width="140" height="35" rx="6" fill="#24466A" stroke="#D8B68A" stroke-width="1"/>
      <text x="82" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#F6F5F1" text-anchor="middle">COMPLETE SALE →</text>
    </g>
  </g>
</svg>