<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDoc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A121D"/>
      <stop offset="100%" stop-color="#142438"/>
    </linearGradient>
    <linearGradient id="champGradDoc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EADF"/>
      <stop offset="100%" stop-color="#D8B68A"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bgDoc)"/>

  <!-- Top App Window Bar -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="500" height="270" rx="12" fill="#101D2D" stroke="rgba(216, 182, 138, 0.4)" stroke-width="1.5"/>
    <rect x="0" y="0" width="500" height="34" rx="12" fill="#182A40"/>
    <rect x="0" y="22" width="500" height="12" fill="#182A40"/>

    <text x="24" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10.5" fill="#D8B68A">Records Tracking Management System with QR Code</text>
    <rect x="360" y="7" width="120" height="20" rx="10" fill="#1A3450"/>
    <text x="420" y="21" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#D8B68A" text-anchor="middle">ISO 25010: 4.44/5.00</text>

    <!-- Workflow Progress Nodes -->
    <g transform="translate(30, 55)">
      <!-- Line -->
      <line x1="20" y1="20" x2="420" y2="20" stroke="#243C58" stroke-width="2"/>
      
      <!-- Node 1 -->
      <circle cx="20" cy="20" r="10" fill="#10B981"/>
      <path d="M16 20 L19 23 L24 17" stroke="#FFF" stroke-width="2" fill="none"/>
      <text x="20" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#F6F5F1" text-anchor="middle">Initiated</text>

      <!-- Node 2 -->
      <circle cx="150" cy="20" r="10" fill="#10B981"/>
      <path d="M146 20 L149 23 L154 17" stroke="#FFF" stroke-width="2" fill="none"/>
      <text x="150" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#F6F5F1" text-anchor="middle">Deans Office</text>

      <!-- Node 3 -->
      <circle cx="280" cy="20" r="10" fill="#24466A" stroke="#D8B68A" stroke-width="2"/>
      <circle cx="280" cy="20" r="4" fill="#D8B68A"/>
      <text x="280" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#D8B68A" text-anchor="middle">VP Academic</text>

      <!-- Node 4 -->
      <circle cx="420" cy="20" r="10" fill="#172638" stroke="#243C58" stroke-width="1.5"/>
      <text x="420" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#8FA2B6" text-anchor="middle">Archived</text>
    </g>

    <!-- Document Info Card -->
    <g transform="translate(30, 120)">
      <rect x="0" y="0" width="300" height="85" rx="8" fill="#142436" stroke="#243C58" stroke-width="1"/>
      <text x="15" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#F6F5F1">Document: ADSSU-MOA-2025-089</text>
      <text x="15" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#8FA2B6">Type: Institutional Memorandum of Agreement</text>
      <text x="15" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#8FA2B6">Routing Elapsed: 18h 42m (Target: &lt; 24h)</text>
      <text x="15" y="74" font-family="'JetBrains Mono', monospace" font-size="7" fill="#10B981">✓ QR Cryptographic Hash: SHA-256 Verified</text>

      <!-- QR Badge Graphic Right -->
      <rect x="330" y="0" width="110" height="85" rx="8" fill="#142436" stroke="#243C58" stroke-width="1"/>
      <!-- QR mock matrix -->
      <g transform="translate(345, 12)">
        <rect x="0" y="0" width="18" height="18" fill="none" stroke="#D8B68A" stroke-width="2"/>
        <rect x="4" y="4" width="10" height="10" fill="#D8B68A"/>
        <rect x="62" y="0" width="18" height="18" fill="none" stroke="#D8B68A" stroke-width="2"/>
        <rect x="66" y="4" width="10" height="10" fill="#D8B68A"/>
        <rect x="0" y="42" width="18" height="18" fill="none" stroke="#D8B68A" stroke-width="2"/>
        <rect x="4" y="46" width="10" height="10" fill="#D8B68A"/>
        <!-- center dots -->
        <circle cx="40" cy="30" r="3" fill="#F6F5F1"/>
        <circle cx="50" cy="20" r="2.5" fill="#F6F5F1"/>
        <circle cx="30" cy="50" r="3" fill="#F6F5F1"/>
        <circle cx="50" cy="45" r="2.5" fill="#F6F5F1"/>
      </g>
    </g>
  </g>
</svg>