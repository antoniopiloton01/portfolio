<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgScan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A121D"/>
      <stop offset="100%" stop-color="#142438"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bgScan)"/>

  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="500" height="270" rx="12" fill="#101D2D" stroke="rgba(216, 182, 138, 0.4)" stroke-width="1.5"/>
    <rect x="0" y="0" width="500" height="34" rx="12" fill="#182A40"/>
    <rect x="0" y="22" width="500" height="12" fill="#182A40"/>

    <text x="24" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10.5" fill="#D8B68A">BantayEskwela • RFID Gate &amp; GSM Gateway Monitor</text>
    <rect x="365" y="7" width="115" height="20" rx="10" fill="#102B1D"/>
    <circle cx="377" cy="17" r="3.5" fill="#10B981"/>
    <text x="428" y="21" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#6EE7B7" text-anchor="middle">GSM MODEM: LIVE</text>

    <!-- Tap Entry Log -->
    <g transform="translate(25, 55)">
      <!-- Student Tap Card -->
      <rect x="0" y="0" width="220" height="150" rx="8" fill="#142436" stroke="#243C58" stroke-width="1"/>
      <text x="15" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#F6F5F1">Active Gate Reader #01</text>
      
      <circle cx="45" cy="70" r="24" fill="#1D3652"/>
      <path d="M35 70 C35 60 55 60 55 70 Z" fill="#D8B68A"/>
      <circle cx="45" cy="62" r="8" fill="#D8B68A"/>
      
      <text x="80" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#F6F5F1">Student Tap Registered</text>
      <text x="80" y="78" font-family="'JetBrains Mono', monospace" font-size="7" fill="#8FA2B6">RFID: 0014892401</text>
      <text x="80" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#10B981">● ENTRY LOGGED 07:14:02 AM</text>

      <rect x="15" y="110" width="190" height="26" rx="4" fill="#101D2D"/>
      <text x="25" y="127" font-family="'JetBrains Mono', monospace" font-size="7" fill="#D8B68A">Dispatch: SMS Gateway (SIM800L)</text>
    </g>

    <!-- SMS Gateway Live Queue -->
    <g transform="translate(265, 55)">
      <rect x="0" y="0" width="210" height="150" rx="8" fill="#142436" stroke="#243C58" stroke-width="1"/>
      <text x="15" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#F6F5F1">Automated Parent Alerts</text>

      <rect x="12" y="38" width="186" height="46" rx="6" fill="#182A3E" stroke="#243C58" stroke-width="1"/>
      <text x="20" y="52" font-family="'JetBrains Mono', monospace" font-size="7" fill="#60A5FA">To: +63 9XX XXX 8912</text>
      <text x="20" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" fill="#CBD5E1">"Advisory: Student arrived safely at campus gate at 07:14 AM."</text>
      <text x="20" y="77" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#10B981">Status: DELIVERED (0.8s)</text>

      <rect x="12" y="92" width="186" height="46" rx="6" fill="#182A3E" stroke="#243C58" stroke-width="1"/>
      <text x="20" y="106" font-family="'JetBrains Mono', monospace" font-size="7" fill="#60A5FA">To: +63 9XX XXX 1422</text>
      <text x="20" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" fill="#CBD5E1">"Advisory: Student departed campus gate at 04:32 PM."</text>
      <text x="20" y="131" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#10B981">Status: DELIVERED (1.1s)</text>
