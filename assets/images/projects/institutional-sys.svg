<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgScvax" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A121D"/>
      <stop offset="100%" stop-color="#142438"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bgScvax)"/>

  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="500" height="270" rx="12" fill="#101D2D" stroke="rgba(216, 182, 138, 0.4)" stroke-width="1.5"/>
    <rect x="0" y="0" width="500" height="34" rx="12" fill="#182A40"/>
    <rect x="0" y="22" width="500" height="12" fill="#182A40"/>

    <text x="24" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10.5" fill="#D8B68A">SCVAX: Nationwide Vaccination Management Information System</text>
    <rect x="360" y="7" width="120" height="20" rx="10" fill="#1A3450"/>
    <text x="420" y="21" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#D8B68A" text-anchor="middle">SCOPUS (JESTEC '23)</text>

    <!-- Geographic Coverage & Dose Metrics -->
    <g transform="translate(25, 55)">
      <!-- Metric Box 1 -->
      <rect x="0" y="0" width="140" height="60" rx="6" fill="#142436" stroke="#243C58" stroke-width="1"/>
      <text x="12" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#8FA2B6">TOTAL REGISTERED</text>
      <text x="12" y="44" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#D8B68A">1,248,930</text>

      <!-- Metric Box 2 -->
      <rect x="155" y="0" width="140" height="60" rx="6" fill="#142436" stroke="#243C58" stroke-width="1"/>
      <text x="12" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#8FA2B6">DOSE COMPLETION</text>
      <text x="12" y="44" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#10B981">94.8%</text>

      <!-- Metric Box 3 -->
      <rect x="310" y="0" width="140" height="60" rx="6" fill="#142436" stroke="#243C58" stroke-width="1"/>
      <text x="12" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#8FA2B6">COLD-CHAIN COMPLIANCE</text>
      <text x="12" y="44" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#60A5FA">99.2%</text>
    </g>

    <!-- Dose Progress Bar Chart -->
    <g transform="translate(25, 130)">
      <rect x="0" y="0" width="450" height="75" rx="8" fill="#142436" stroke="#243C58" stroke-width="1"/>
      <text x="15" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#F6F5F1">Vaccination Administration Ledger by Regional Center</text>
      
      <!-- Bars -->
      <rect x="15" y="35" width="280" height="10" rx="3" fill="#24466A"/>
      <rect x="15" y="35" width="240" height="10" rx="3" fill="#D8B68A"/>
      <text x="310" y="44" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#D8B68A">Dose 1 (86%)</text>

      <rect x="15" y="52" width="280" height="10" rx="3" fill="#24466A"/>
      <rect x="15" y="52" width="210" height="10" rx="3" fill="#60A5FA"/>
      <text x="310" y="61" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#60A5FA">Booster (75%)</text>
    </g>
  </g>
</svg>